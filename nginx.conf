# ============================================================
# SafetyVoice UK — Nginx Reverse Proxy
# deploy.sh replaces __DOMAIN__, __APP_PORT__, __APP_DIR__
# before copying this file into the Nginx configuration dir.
# ============================================================

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Redirect HTTP -> HTTPS (uncomment after SSL is set up)
    # return 301 https://$host$request_uri;

    # --- Proxy all requests to the Node.js app ---
    location / {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Security headers ---
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # --- Gzip ---
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # --- Logging ---
    access_log /var/log/nginx/safetyvoice-uk.access.log;
    error_log  /var/log/nginx/safetyvoice-uk.error.log;
}

